name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Decides which jobs make sense yet: the app and the database appear with the first slice.
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.files.outputs.has_app }}
      has_db: ${{ steps.files.outputs.has_db }}
    steps:
      - uses: actions/checkout@v7
      - id: files
        run: |
          echo "has_app=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_db=$([ -f supabase/config.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test scripts/check-skills.test.mjs
      - run: node scripts/check-skills.mjs

  check:
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:assets

  db:
    needs: detect
    if: needs.detect.outputs.has_db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: supabase/setup-cli@v3
        with:
          version: '3.0.0'
      - run: node scripts/generate-db-grid-tests.ts --check
      - run: supabase start
      - run: supabase test db --local

  e2e:
    needs: [detect, check]
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - if: needs.detect.outputs.has_db == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: '3.0.0'
      - if: needs.detect.outputs.has_db == 'true'
        run: supabase start > /dev/null
      - run: pnpm test:e2e
