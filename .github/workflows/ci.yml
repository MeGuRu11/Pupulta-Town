name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Decides which jobs make sense yet: the app and the database appear with the first slice.
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.files.outputs.has_app }}
      has_db: ${{ steps.files.outputs.has_db }}
    steps:
      - uses: actions/checkout@v7
      - id: files
        run: |
          echo "has_app=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_db=$([ -f supabase/config.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/sync-skills.mjs --check

  check:
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:assets

  db:
    needs: detect
    if: needs.detect.outputs.has_db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
      - run: supabase start
      - run: supabase test db

  e2e:
    needs: [detect, check]
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The end-to-end tests need the database once it exists (PR 3 of the first slice adds supabase/).
      - if: needs.detect.outputs.has_db == 'true'
        uses: supabase/setup-cli@v3
      - if: needs.detect.outputs.has_db == 'true'
        run: supabase start
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
